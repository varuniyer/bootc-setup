flush ruleset

define metadata_ip    = 169.254.169.254
define web_ports      = { 80, 443 }

table inet filter {
    set abusers {
        type ipv4_addr
        flags timeout
        timeout 10m
    }

    # This chain runs at raw priority, before conntrack, so the packets it drops create no conntrack entries.
    chain prerouting_raw {
        type filter hook prerouting priority raw; policy accept;

        meta nfproto ipv6 drop

        ip saddr @abusers drop

        tcp dport $web_ports tcp flags & (fin | syn | rst | ack) == syn meter web_syn_rate { ip saddr timeout 10m limit rate over 100/second burst 200 packets } add @abusers { ip saddr } drop
    }

    chain input {
        type filter hook input priority filter; policy drop;

        iifname "lo" accept

        ct state established,related accept

        # DHCP replies
        udp sport 67 udp dport 68 accept

        icmp type echo-request limit rate 10/second accept

        ct state invalid drop

        tcp dport 443 ct state new meter connlimit_443 { ip saddr ct count over 50 } add @abusers { ip saddr } drop

        tcp dport 80 ct state new meter connlimit_80 { ip saddr ct count over 30 } add @abusers { ip saddr } drop

        tcp dport $web_ports ct state new accept

        # Direct WireGuard paths from Tailscale peers
        udp dport $wireguard_port accept

        limit rate 5/second log prefix "nft-drop: " flags all
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy drop;

        meta nfproto ipv6 drop

        oifname "lo" accept

        ct state established,related accept
        ct state invalid drop

        # DHCP requests
        udp sport 68 udp dport 67 accept

        # DNS
        udp dport 53 accept
        tcp dport 53 accept

        # NTP
        udp dport 123 accept

        # Tailscale: WireGuard from its fixed source port, STUN for NAT discovery
        udp sport $wireguard_port accept
        udp dport 3478 accept

        ip daddr $metadata_ip tcp dport 80 meta skuid 0 accept
        ip daddr $metadata_ip drop

        tcp dport $web_ports accept

        meta l4proto icmp accept
    }
}
