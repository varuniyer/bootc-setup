# postgresql.service blocks AF_INET6, so 'localhost' would also try ::1 and log a failure.
listen_addresses = '127.0.0.1'
port = 5432
# Source builds default the socket to /tmp, where PrivateTmp would scope it to
# the unit that started the server.
unix_socket_directories = '/run/postgresql'

# Sized for c4a-standard-1 (1 Arm vCPU, 4GB RAM).
max_connections = 200
max_parallel_workers_per_gather = 0
shared_buffers = 1GB
work_mem = 4MB
random_page_cost = 1.1
effective_cache_size = 2GB
max_wal_size = 4GB
checkpoint_timeout = 30min
maintenance_work_mem = 256MB
autovacuum_max_workers = 1
autovacuum_work_mem = 64MB