name: build-and-deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: [README.md, AGENTS.md]

concurrency:
  group: build-and-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Build and deploy
        run: sudo -E PATH="$PATH" bash build-and-deploy.sh
        env:
          CI_REGISTRY: ghcr.io
          CI_REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
          CI_REGISTRY_USER: ${{ github.actor }}
          CI_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          SIGSTORE_PRIVATE_KEY: ${{ secrets.SIGSTORE_PRIVATE_KEY }}
          SIGSTORE_PASSPHRASE: ${{ secrets.SIGSTORE_PASSPHRASE }}
