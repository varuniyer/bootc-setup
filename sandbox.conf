# Each shipped unit links this as a drop-in, which parses after the unit file. A unit can add
# to a nonempty list setting such as RestrictAddressFamilies, and this file overrides its single-value settings.
[Service]
ProtectSystem=strict
ProtectHome=true
ProtectProc=invisible
ProtectClock=true
ProtectKernelLogs=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
ProtectHostname=true
PrivateDevices=true
PrivateTmp=disconnected
PrivateIPC=true
RestrictNamespaces=true
NoNewPrivileges=true
LockPersonality=true
MemoryDenyWriteExecute=true
RestrictSUIDSGID=true
RestrictRealtime=true
RestrictAddressFamilies=AF_UNIX AF_INET
IPAddressDeny=any
SystemCallFilter=@system-service
SystemCallArchitectures=native
# An empty assignment discards the unit file's capabilities, so a unit that needs any
# lists them in a zz-capabilities.conf drop-in, which sorts after sandbox.conf.
CapabilityBoundingSet=
